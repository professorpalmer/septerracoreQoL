; Septerra Core QoL — dgVoodoo2 2.86.4
; Scale native 640x480 up to the desktop. Do NOT force DirectX Resolution
; (ACCESS_VIOLATION). PresentationModel=seq avoids full-black flash frames
; seen in OBS/on-screen with discard/flip on this DirectDraw title.
Version                              = 0x286

[General]
OutputAPI                            = d3d11_fl11_0
Adapters                             = all
FullScreenOutput                     = default
FullScreenMode                       = false
ScalingMode                          = stretched_4_3
ProgressiveScanlineOrder             = false
EnumerateRefreshRates                = false
Brightness                           = 100
Color                                = 100
Contrast                             = 100
InheritColorProfileInFullScreenMode  = false
KeepWindowAspectRatio                = true
CaptureMouse                         = false
CenterAppWindow                      = true
DisableScreenSaver                   = false

[GeneralExt]
DesktopResolution                    =
DesktopBitDepth                      =
DeframerSize                         = 1
ImageScaleFactor                     = 0
CursorScaleFactor                    = 0
DisplayROI                           =
Resampling                           = pointsampled
PresentationModel                    = seq
ColorSpace                           = argb8888_srgb
FreeMouse                            = true
WindowedAttributes                   = borderless,fullscreensize
FullscreenAttributes                 = fake
FPSLimit                             = 60
Environment                          =
SystemHookFlags                      =

[Glide]
VideoCard                           = voodoo_2
OnboardRAM                          = 8
MemorySizeOfTMU                     = 4096
NumberOfTMUs                        = 2
TMUFiltering                        = appdriven
DisableMipmapping                   = false
Resolution                          = unforced
Antialiasing                        = appdriven
EnableGlideGammaRamp                = true
ForceVerticalSync                   = true
ForceEmulatingTruePCIAccess         = false
16BitDepthBuffer                    = false
3DfxWatermark                       = true
3DfxSplashScreen                    = false
PointcastPalette                    = false
EnableInactiveAppState              = false

[GlideExt]
DitheringEffect                     = pure32bit
Dithering                           = forcealways
DitherOrderedMatrixSizeScale        = 0

[DirectX]
DisableAndPassThru                  = false
VideoCard                           = internal3D
VRAM                                = 256
Filtering                           = appdriven
Mipmapping                          = appdriven
KeepFilterIfPointSampled            = false
Resolution                          = unforced
Antialiasing                        = appdriven
AppControlledScreenMode             = true
DisableAltEnterToToggleScreenMode   = false
Bilinear2DOperations                = false
PhongShadingWhenPossible            = false
ForceVerticalSync                   = true
dgVoodooWatermark                   = false
FastVideoMemoryAccess               = false
DisableD3DTnLDevice                 = false

[DirectXExt]
DefaultEnumeratedResolutions        = classics
EnumeratedResolutionBitdepths       = all
DitheringEffect                     = high_quality
Dithering                           = forceon16bit
DitherOrderedMatrixSizeScale        = 0
DepthBuffersBitDepth                = appdriven
Default3DRenderFormat               = auto
MaxVSConstRegisters                 = 256
D3D12BoundsChecking                 = false
NPatchTesselationLevel              = 0
